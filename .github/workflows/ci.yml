
name: Cloud Deploy Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clouddeploy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clouddeploy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Spring Boot application
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/clouddeploy
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify